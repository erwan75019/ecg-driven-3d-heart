<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECG-Driven 3D Heart Visualization</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>ECG-Driven 3D Heart Visualization</h1>
        <p>Interactive visualization of the cardiac cycle from ECG signals</p>
    </header>

    <main>

        <section id="ecg-section">
            <h2>ECG Signal</h2>

            <div id="ecg-container">
                <canvas
                    id="ecg-canvas"
                    role="img"
                    aria-label="Static ECG signal showing a P wave, a QRS complex, and a T wave."
                >
                    Your browser does not support the canvas element.
                </canvas>
            </div>
        </section>

        <section id="heart-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                <h2 style="margin: 0;">3D Heart</h2>
                <!-- Conteneur des 3 boutons stylisés alignés avec le texte -->
                <div style="display: flex; gap: 8px;">
                    <button id="start-btn" style="padding: 5px 12px; background-color: #16a34a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">Start</button>
                    <button id="pause-btn" style="padding: 5px 12px; background-color: #ca8a04; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">Pause</button>
                    <button id="restart-btn" style="padding: 5px 12px; background-color: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">Restart</button>
                </div>
            </div>

            <div id="heart-container">
                <p>3D heart visualization will appear here.</p>
            </div>
        </section>

        <section id="cardiac-phase">
            <h2>Cardiac Phase</h2>
            <p id="phase-display">Waiting for ECG data...</p>
        </section>

    </main>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
