<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECG-Driven 3D Heart Visualization</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>ECG-Driven 3D Heart Visualization</h1>
        <p>Interactive visualization of the cardiac cycle from ECG signals</p>
    </header>

    <main>

        <section id="ecg-section">
            <h2>ECG Signal</h2>

            <div id="ecg-container">
                <p>ECG visualization will appear here.</p>
            </div>
        </section>

        <section id="heart-section">
            <h2>3D Heart</h2>

            <div id="heart-container">
                <p>3D heart visualization will appear here.</p>
            </div>
        </section>

        <section id="cardiac-phase">
            <h2>Cardiac Phase</h2>
            <p id="phase-display">Waiting for ECG data...</p>
        </section>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
